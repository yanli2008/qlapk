backend:
  name: github
  repo: yanli2008/qlapk
  branch: main
  auth_type: pkce
  app_id: Ov23liFIilIMdmElyDVM

media_folder: "static/uploads"
public_folder: "/uploads"

collections:
  - name: "posts"
    label: "资源文章"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{title}}"
    fields:
      - {label: "标题", name: "title", widget: "string"}
      - {label: "发布日期", name: "date", widget: "datetime"}
      - {label: "简介描述", name: "description", widget: "text"}
      - {label: "标签", name: "tags", widget: "list"}
      - {label: "封面图", name: "cover", widget: "object", fields: [
          {label: "图片链接", name: "image", widget: "image"},
          {label: "图片说明", name: "alt", widget: "string"}
        ]}
      - {label: "下载链接", name: "download_url", widget: "string"}
      - {label: "提取码", name: "extract_code", widget: "string"}
      - {label: "正文内容", name: "body", widget: "markdown"}
