baseURL: "https://qlapk.pages.dev/"
title: "奇乐共享"
languageCode: "zh-CN"
theme: "PaperMod"
enableRobotsTXT: true
enableEmoji: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  minifyOutput: true

params:
  env: production
  title: "奇乐共享"
  description: "免费软件资源分享站"
  author: "yanli2008"
  defaultTheme: auto
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  cover:
    hidden: false
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - name: 首页
      url: /
      weight: 1
    - name: 资源
      url: /posts/
      weight: 2
    - name: 标签
      url: /tags/
      weight: 3
    - name: 搜索
      url: /search/
      weight: 4

outputs:
  home:
    - HTML
    - RSS
    - JSON
