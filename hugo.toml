baseURL = "https://qlapk.pages.dev/"
title = "奇乐共享"
languageCode = "zh-CN"
theme = "PaperMod"
enableRobotsTXT = true
enableEmoji = true
buildDrafts = false
buildFuture = false
buildExpired = false

[minify]
  minifyOutput = true

[params]
  env = "production"
  title = "奇乐共享"
  description = "资源分享站点"
  author = "yanli2008"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  fuseOpts = {isCaseSensitive = false, shouldSort = true, location = 0, distance = 1000, threshold = 0.4, keys = ["title", "permalink", "summary", "content"]}

[params.assets]
  disableHLJS = false

[params.search]
  enable = true

[menu.main]
[[menu.main]]
name = "首页"
url = "/"
weight = 1
[[menu.main]]
name = "文章"
url = "/posts/"
weight = 2
[[menu.main]]
name = "标签"
url = "/tags/"
weight = 3
[[menu.main]]
name = "搜索"
url = "/search/"
weight = 4

[outputs]
home = ["HTML", "RSS", "JSON"]
